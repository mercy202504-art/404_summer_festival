<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>接続記録</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="offer-body">

    <div class="offer-container">
      <h1>接続記録</h1>

      <div class="record-card">
  <p>接続番号</p>
  <strong id="log-number">------</strong>

  <p>観測日時</p>
  <span id="log-date">----</span>
  <span id="log-time">--:--</span>
</div>

      <a href="home.html" class="back-button"> ← 灯籠の流れる場所へ戻る </a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>
<script>
  const numberElement = document.getElementById("log-number");
  const dateElement = document.getElementById("log-date");
  const timeElement = document.getElementById("log-time");

  const savedNumber = sessionStorage.getItem("connectionNumber");

  if (savedNumber) {
    numberElement.textContent = savedNumber;
  }

  const now = new Date();

  dateElement.textContent = now.toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  });

  timeElement.textContent = now.toLocaleTimeString("ja-JP", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });
</script>

  </body>
</html>
